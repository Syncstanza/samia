name: Build the Android APK
description: Speech model + web bundle + Capacitor + Gradle, signed with the project key when the secrets exist.
inputs:
  version-name:
    description: 'versionName, e.g. 1.2.0 or 0.1.57-dev'
    required: true
  version-code:
    description: 'versionCode (a whole number that only ever goes up)'
    required: true
  app-id:
    description: 'applicationId'
    default: com.syncstanza.samia
  app-name:
    description: 'Name under the icon'
    default: "Sami'a"
  out:
    description: 'File name for the finished APK'
    required: true
  keystore-b64:
    description: 'The signing key, base64 (secret SAMIA_KEYSTORE_B64)'
    default: ''
  keystore-password:
    description: 'Password of the signing key (secret SAMIA_KEYSTORE_PASSWORD)'
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Android SDK licenses (the runner already has the SDK; Gradle fetches what it is missing)
      shell: bash
      run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true
    - name: Web bundle
      shell: bash
      run: |
        npm ci
        npm run model
        node tools/android-www.mjs
    - name: Signing key
      shell: bash
      env:
        KS_B64: ${{ inputs.keystore-b64 }}
        KS_PW: ${{ inputs.keystore-password }}
      run: |
        if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/samia.keystore"
          echo "SAMIA_KEYSTORE=$RUNNER_TEMP/samia.keystore" >> "$GITHUB_ENV"
          echo "SAMIA_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          echo "SAMIA_KEY_ALIAS=samia" >> "$GITHUB_ENV"
          echo "Signing with the project key."
        else
          echo "::warning::No signing key (secrets SAMIA_KEYSTORE_B64 and SAMIA_KEYSTORE_PASSWORD). This APK is signed with a throw-away debug key and cannot be updated in place."
        fi
    - name: Gradle
      shell: bash
      working-directory: android-app
      run: |
        npm ci
        npx cap sync android
        cd android
        chmod +x gradlew
        ./gradlew --no-daemon assembleRelease \
          -PsamiaVersionName='${{ inputs.version-name }}' \
          -PsamiaVersionCode='${{ inputs.version-code }}' \
          -PsamiaAppId='${{ inputs.app-id }}' \
          -PsamiaAppName="${{ inputs.app-name }}"
    - name: Name the APK
      shell: bash
      run: |
        mkdir -p dist
        cp android-app/android/app/build/outputs/apk/release/app-release.apk "dist/${{ inputs.out }}"
        ls -la dist
