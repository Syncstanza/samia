name: Dev build
# Builds test copies from the dev branch so they can be tried before anything is public.
# They have their own name ("Samia DEV") and settings, so they run next to a real install later.
# Published as DRAFT releases (dev-windows, dev-linux): a draft is visible only to people with
# write access to the repo, so only the owner sees it (github.com/Syncstanza/samia/releases while signed in).
on:
  push:
    branches: [dev]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and test
        run: |
          npm ci
          npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, get the speech model, build the portable dev .exe
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm test
          npm run model
          npm version "0.1.$GITHUB_RUN_NUMBER-dev" --no-git-tag-version --allow-same-version
          npx electron-builder --publish never --win portable -c.productName="Samia DEV" -c.appId=com.syncstanza.samia.dev '-c.portable.artifactName=Samia-DEV-${version}.exe'
      - name: Publish as the private "dev-windows" draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name=="dev-windows") | .id'); do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          git push origin --delete dev-windows 2>/dev/null || true
          gh release create dev-windows dist/Samia-DEV-*.exe --draft --title "Sami'a DEV (Windows test build)" --notes "A TEST build from the dev branch: download and double-click, no install. Keys: Space start a turn, Enter done, H home, S settings, arrows move by hand, M mute, B blank, F full screen, Alt+F4 quit." --target "$GITHUB_SHA"

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, get the speech model, build the dev AppImage
        run: |
          npm ci
          npm run model
          npm version "0.1.$GITHUB_RUN_NUMBER-dev" --no-git-tag-version --allow-same-version
          npx electron-builder --publish never --linux AppImage -c.productName="Samia DEV" -c.appId=com.syncstanza.samia.dev '-c.linux.artifactName=Samia-DEV-${version}.${ext}'
      - name: Publish as the private "dev-linux" draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name=="dev-linux") | .id'); do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          git push origin --delete dev-linux 2>/dev/null || true
          gh release create dev-linux dist/Samia-DEV-*.AppImage --draft --title "Sami'a DEV (Linux test build)" --notes "A TEST build from the dev branch. chmod +x Samia-DEV-*.AppImage, then run it (add --no-sandbox on newer Ubuntu/Mint if it won't start)." --target "$GITHUB_SHA"

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-android
        with:
          version-name: 0.1.${{ github.run_number }}-dev
          version-code: ${{ github.run_number }}
          app-id: com.syncstanza.samia.dev
          app-name: Sami'a DEV
          out: Samia-DEV-0.1.${{ github.run_number }}.apk
          keystore-b64: ${{ secrets.SAMIA_KEYSTORE_B64 }}
          keystore-password: ${{ secrets.SAMIA_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          retention-days: 3

  android-test:
    # Starts the APK on an emulator and waits for the speech engine to report ready:
    # proves the page, worker, speech model and microphone permission all work inside Android's WebView.
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk
      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/android-smoke.sh apk/*.apk com.syncstanza.samia.dev

  android-publish:
    needs: android-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk
      - name: Publish as the private "dev-android" draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name=="dev-android") | .id'); do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          git push origin --delete dev-android 2>/dev/null || true
          gh release create dev-android apk/*.apk --draft --title "Sami'a DEV (Android test build)" --notes "A TEST build from the dev branch. Open this page on your phone, tap the .apk, allow installs from the browser when asked, and install. It installs next to the real app (Sami'a DEV)." --target "$GITHUB_SHA"
