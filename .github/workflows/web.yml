name: Web
# Builds the hosted (browser) version. Every push to dev builds it and keeps the files as a downloadable
# artifact (private, only people with access to the repo). It goes live on GitHub Pages ONLY from main.
on:
  push:
    branches: [dev, main]
    paths: ['src/**', 'data/**', 'vendor/**', 'web/**', 'tools/web-build.mjs', 'package.json', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, get the speech model, build the site
        run: |
          npm ci
          npm run model
          node tools/web-build.mjs --base /samia/
      - name: Keep the build (dev)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist
          retention-days: 14
      - name: Prepare for Pages (main)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
