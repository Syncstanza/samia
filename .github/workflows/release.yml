name: Release
# Builds the downloads from main and publishes them as a GitHub release: Windows installer, Android APK,
# Windows portable .exe, Linux AppImage. Start it from Actions -> Release -> Run workflow
# (version = package.json's version, e.g. 1.0.0), or by pushing a tag like v1.0.0.
# The release stays a draft until every download is attached, then it is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci
          npm test

  draft:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release from RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --draft --title "Sami'a ${TAG#v}" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"

  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the installer and the portable .exe
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm test
          npm run model
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npx electron-builder --publish never --win
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # The .sha256 files are what the in-app updater checks each download against.
        run: |
          for f in dist/Samia-Setup-*.exe "dist/Samia-${TAG#v}.exe"; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done
          gh release upload "$TAG" dist/Samia-Setup-*.exe "dist/Samia-${TAG#v}.exe" dist/Samia-*.exe.sha256 --clobber

  linux:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the AppImage
        run: |
          npm ci
          npm run model
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npx electron-builder --publish never --linux AppImage
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/Samia-*.AppImage; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done
          gh release upload "$TAG" dist/Samia-*.AppImage dist/Samia-*.AppImage.sha256 --clobber

  android:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The signing key must exist (an APK signed with a throw-away key could never be updated)
        env:
          KS: ${{ secrets.SAMIA_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secrets SAMIA_KEYSTORE_B64 and SAMIA_KEYSTORE_PASSWORD are missing (see docs/RELEASING.md)."; exit 1; fi
      - name: Version code (1.2.3 -> 10203)
        id: v
        run: |
          v="${TAG#v}"; IFS=. read -r a b c <<< "$v"
          echo "code=$((a*10000 + b*100 + c))" >> "$GITHUB_OUTPUT"
          echo "name=$v" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-android
        with:
          version-name: ${{ steps.v.outputs.name }}
          version-code: ${{ steps.v.outputs.code }}
          out: Samia-${{ steps.v.outputs.name }}.apk
          keystore-b64: ${{ secrets.SAMIA_KEYSTORE_B64 }}
          keystore-password: ${{ secrets.SAMIA_KEYSTORE_PASSWORD }}
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="dist/Samia-${TAG#v}.apk"
          sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
          gh release upload "$TAG" "$f" "$f.sha256" --clobber

  publish:
    # The desktop downloads publish even if the Android build has a problem; the APK is added when it works.
    needs: [windows, linux, android]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
