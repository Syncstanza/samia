name: Release
# Pushing a version tag (v1.0.0, v1.1.0, ...) builds the public downloads and publishes
# them as a GitHub release: Windows installer, Windows portable .exe, Linux AppImage.
# The release stays a draft until every download is attached, then it is published.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci
          npm test

  draft:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release from RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Sami'a ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md --verify-tag

  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the installer and the portable .exe
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm test
          npm run model
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npx electron-builder --publish never --win
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/Samia-Setup-*.exe "dist/Samia-${GITHUB_REF_NAME#v}.exe" --clobber

  linux:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the AppImage
        run: |
          npm ci
          npm run model
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npx electron-builder --publish never --linux AppImage
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/Samia-*.AppImage --clobber

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
